[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robousr"
version = "0.0.0"
description = "RoboUsr Telegram AI userbot with FastAPI, Telethon, and local llama.cpp (OpenAI-compatible) integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

authors = [{ name = "Boris Karaoglanov", email = "boris@mrakbook.com" }]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "SQLAlchemy>=2.0.0",
    "PyMySQL>=1.1.0",
    "telethon>=1.37.0",
    "openai>=1.30.0",
    "pydantic>=1.10,<3.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "black", "ruff"]

[project.urls]
Homepage = "https://robousr.mrakbook.com/"
Source = "https://github.com/mrakbook/robousr"

[tool.hatch.metadata]
allow-direct-references = true
